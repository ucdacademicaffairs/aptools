<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Blue Cluster Student Payroll Calculator</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="shared-tools.css">
	<script src="header.js" defer></script>
	<style>
		.appointment-row {
			border-bottom: 1px solid #eee;
			padding-bottom: 1rem;
			margin-bottom: 1rem;
		}

		.toggle-btn svg {
			transition: transform 0.3s ease-in-out;
		}

		.toggle-btn.is-open svg {
			transform: rotate(90deg);
		}

		input[readonly] {
			background-color: #f0f0f0;
			cursor: not-allowed;
		}

		#show-work-container p {
			margin-bottom: 0.5rem;
			font-family: monospace;
			font-size: 0.875rem;
		}

		/* Styles for hiding the WS Savings column */
		.ws-hidden .ws-savings-col {
			display: none;
		}
	</style>
</head>

<body>
	<div id="header-placeholder"></div>

	<main class="w-full max-w-6xl mx-auto p-4 md:p-8">
		<div class="space-y-6">
			<div class="relative text-center mb-6 py-4">
				<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-6">
					<div class="relative text-center md:text-left">
						<h2 class="text-4xl font-bold text-[#002855]">Student Employment Cost Calculator</h2>
					</div>
					<div class="flex items-center gap-2 justify-center bg-white p-2 rounded-lg border shadow-sm">
						<label for="academic-year-select"
							class="text-sm font-semibold text-gray-700 whitespace-nowrap">Academic Year:</label>
						<select id="academic-year-select"
							class="h-9 px-3 border rounded text-sm bg-transparent focus:outline-none focus:ring-2 focus:ring-[#002855]">
							<option value="2025-2026">2025-2026</option>
							<option value="2026-2027">2026-2027</option>
							<option value="2027-2028">2027-2028</option>
							<option value="2028-2029">2028-2029</option>
						</select>
					</div>
				</div>
			</div>

			<div class="card">
				<div class="flex justify-between items-center mb-4">
					<h3 class="text-xl font-bold text-gray-800">Add Appointment</h3>
					<button id="clear-all-btn" class="btn btn-delete text-sm">Clear All</button>
				</div>
				<div class="flex flex-wrap gap-2" id="add-buttons">
					<button class="btn" data-type="gsr">GSR</button>
					<button class="btn" data-type="ta">TA</button>
					<button class="btn" data-type="ai">AI</button>
					<button class="btn" data-type="reader">Reader</button>
					<button class="btn" data-type="tutor">Tutor</button>
					<button class="btn" data-type="student-assistant">Student Assistant</button>
				</div>
			</div>

			<div class="card">
				<h3 class="text-xl font-bold text-gray-800 mb-4">Appointments</h3>
				<div id="appointments-container">
					<p class="text-gray-500">No appointments added yet. Click a button above to begin.</p>
				</div>
			</div>

			<div id="fte-warning-card" class="card bg-yellow-100 border-yellow-400 text-yellow-800 hidden"></div>
			<div id="nrst-warning-card" class="card bg-yellow-100 border-yellow-400 text-yellow-800 hidden"></div>

			<div id="work-study-summary-card" class="card bg-green-100 border-green-400 text-green-800 hidden"></div>

			<div class="card bg-[#fafafa]">
				<div class="flex justify-between items-center mb-4">
					<h3 class="text-xl font-bold text-gray-800">Cost Summary by Quarter</h3>
					<button id="copy-summary-btn" class="btn text-sm">Copy to Clipboard</button>
				</div>
				<div class="overflow-x-auto">
					<table class="min-w-full text-sm text-left" id="summary-table">
						<thead class="bg-gray-200">
							<tr>
								<th class="p-2">Quarter</th>
								<th class="p-2 text-right">Total Salary</th>
								<th class="p-2 text-right">Total Benefits & Fees</th>
								<th class="p-2 text-right text-green-600 ws-savings-col">WS Savings</th>
								<th class="p-2 text-right">Total Cost</th>
							</tr>
						</thead>
						<tbody id="summary-table-body">
						</tbody>
						<tfoot class="border-t-2 border-gray-800">
							<tr class="font-bold">
								<td class="p-2">Grand Total</td>
								<td class="p-2 text-right" id="summary-total-salary">$0.00</td>
								<td class="p-2 text-right" id="summary-total-benefits-fees">$0.00</td>
								<td class="p-2 text-right text-green-600 ws-savings-col" id="summary-total-savings">
									$0.00</td>
								<td class="p-2 text-right" id="summary-grand-total">$0.00</td>
							</tr>
						</tfoot>
					</table>
				</div>
			</div>

			<div class="card">
				<button id="toggle-work-btn"
					class="toggle-btn w-full text-left font-bold text-lg text-gray-800 flex items-center gap-2">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
						xmlns="http://www.w3.org/2000/svg">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
					</svg>
					<span>Show Your Work</span>
				</button>
				<div id="show-work-container" class="hidden mt-4 space-y-4">
				</div>
			</div>

			<div class="card">
				<button id="toggle-costs-btn"
					class="toggle-btn w-full text-left font-bold text-lg text-gray-800 flex items-center gap-2">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
						xmlns="http://www.w3.org/2000/svg">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
					</svg>
					<span>Base Costs & Rates</span>
				</button>
				<div id="base-costs-container" class="hidden mt-4 space-y-4">
				</div>
			</div>
		</div>
	</main>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			// State and Data Management
			// We provide default money stuff, but it can be edited by the user in the UI. This information changes annually, so notionally this should be updated by "me" on 7/1 in annual-config.json. Or whenever the union stuff shakes out.
			// Fetch the configuration dynamically
			let COST_DATA = {};

			// The main array for the calculator, holding all appointment objects.
			let appointments = [];
			// A lil' counter to ensure each new appointment has a unique ID.
			let appointmentCounter = 0;
			// I'd also like to store the step-by-step calculation details for the "Show Your Work" section.
			let calculationDetails = {};

			let currentYearKey = "";

			function updateSelectedYear(year) {
				currentYearKey = year;
				const yearScale = COST_DATA.SCALES[year];
				if (yearScale) {
					COST_DATA.GSR_SCALE = yearScale.GSR_SCALE;
					COST_DATA.TA_SCALE = yearScale.TA_SCALE;
					COST_DATA.AI_SCALE = yearScale.AI_SCALE;
					COST_DATA.READER_TUTOR_RATE = yearScale.READER_TUTOR_RATE;
					COST_DATA.TUTOR_INDIVIDUAL_RATE = yearScale.TUTOR_INDIVIDUAL_RATE;
					COST_DATA.TUTOR_GROUP_RATE = yearScale.TUTOR_GROUP_RATE;
				}
			}

			function getDefaultYear() {
				const d = new Date();
				const year = d.getFullYear();
				const selectedYear = d.getMonth() >= 5 ? year : (year - 1);
				const clampedYear = Math.max(2025, Math.min(2028, selectedYear));
				return `${clampedYear}-${clampedYear + 1}`;
			}

			// First, define our initialization wrapper that fetches config
			async function initialize() {
				try {
					const configResponse = await fetch('annual-config.json');
					const configJson = await configResponse.json();
					COST_DATA = configJson;
				} catch (error) {
					console.error("Could not load annual configuration:", error);
					alert("There was an error loading the configuration for this page. Please refresh.");
					return;
				}

				const defaultYear = getDefaultYear();
				const yearSelect = document.getElementById('academic-year-select');
				if (yearSelect) {
					yearSelect.value = defaultYear;
					updateSelectedYear(defaultYear);
					yearSelect.addEventListener('change', (e) => {
						updateSelectedYear(e.target.value);
						populateBaseCosts();
						fullRender();
					});
				} else {
					updateSelectedYear(defaultYear);
				}

				// Apply base costs to UI
				populateBaseCosts();

				// Any initial UI setup that needs COST_DATA happens here...
				// Initial render after data is loaded
				fullRender();
			}

			initialize();

			// DOM element caching
			const addButtonsContainer = document.getElementById('add-buttons');
			const appointmentsContainer = document.getElementById('appointments-container');
			const baseCostsContainer = document.getElementById('base-costs-container');
			const toggleCostsBtn = document.getElementById('toggle-costs-btn');
			const showWorkContainer = document.getElementById('show-work-container');
			const toggleWorkBtn = document.getElementById('toggle-work-btn');
			const nrstWarningCard = document.getElementById('nrst-warning-card');
			const fteWarningCard = document.getElementById('fte-warning-card');
			const workStudySummaryCard = document.getElementById('work-study-summary-card');
			const clearAllBtn = document.getElementById('clear-all-btn');
			const copySummaryBtn = document.getElementById('copy-summary-btn');
			const summaryTable = document.getElementById('summary-table');

			// Event listeners

			// Handles clicks on "Add Appointment"
			addButtonsContainer.addEventListener('click', e => {
				if (e.target.classList.contains('btn')) addAppointment(e.target.dataset.type);
			});

			// Handles the "Clear All" button to reset the calculator.
			clearAllBtn.addEventListener('click', () => {
				appointments = [];
				fullRender();
			});

			// Handles the new "Copy to Clipboard"
			copySummaryBtn.addEventListener('click', () => {
				let text = '';
				// Loop through rows and cells to build a tab-separated string.
				for (const row of summaryTable.rows) {
					const rowData = Array.from(row.cells)
						.filter(cell => !cell.classList.contains('ws-savings-col') || !summaryTable.classList.contains('ws-hidden'))
						.map(cell => cell.innerText.replace(/\$/g, '').replace(/,/g, ''));
					text += rowData.join('\t') + '\n';
				}
				// Use a temporary text area to copy the text to the clipboard
				const textArea = document.createElement('textarea');
				textArea.value = text;
				document.body.appendChild(textArea);
				textArea.select();
				try {
					document.execCommand('copy');
					copySummaryBtn.textContent = 'Copied!';
					setTimeout(() => { copySummaryBtn.textContent = 'Copy to Clipboard'; }, 2000);
				} catch (err) {
					console.error('Failed to copy text: ', err);
				}
				document.body.removeChild(textArea);
			});

			// Handles clicks within the appointment container, to delete them.
			appointmentsContainer.addEventListener('click', e => {
				if (e.target.classList.contains('btn-delete')) {
					const id = parseInt(e.target.dataset.id, 10);
					appointments = appointments.filter(appt => appt.id !== id);
					fullRender();
				}
			});

			// The main event handler for any input change within an appointment card. Updates the application state and triggers a wee DOM update.
			appointmentsContainer.addEventListener('input', e => {
				const target = e.target;
				const row = target.closest('.appointment-row');
				if (!row) return;
				const id = parseInt(row.dataset.id, 10);
				const appt = appointments.find(a => a.id === id);
				if (!appt) return;
				const key = target.dataset.calc;
				if (target.type === 'checkbox') {
					appt.values[key] = target.checked;
				} else {
					appt.values[key] = target.value;
				}
				if (key === 'percentTime') {
					appt.values.hours = (parseFloat(appt.values.percentTime) || 0) * COST_DATA.HOURS_PER_FTE_PERCENT;
				}
				if (key === 'workStudy' || key === 'tutorType') {
					fullRender();
				} else {
					calculateAllCosts();
					updateDOMValues();
				}
			});

			// Toggles the visibility of the "Base Costs & Rates" section.
			toggleCostsBtn.addEventListener('click', () => {
				baseCostsContainer.classList.toggle('hidden');
				toggleCostsBtn.classList.toggle('is-open');
			});

			// Toggles the visibility of the "Show Your Work" section.
			toggleWorkBtn.addEventListener('click', () => {
				showWorkContainer.classList.toggle('hidden');
				toggleWorkBtn.classList.toggle('is-open');
			});

			// Handles input changes within the "Base Costs & Rates" section to allow live editing of the fundamental bits.
			baseCostsContainer.addEventListener('input', e => {
				const keys = e.target.dataset.key.split('.');
				let obj = COST_DATA;
				for (let i = 0; i < keys.length - 1; i++) {
					obj = obj[keys[i]];
				}
				const value = parseFloat(e.target.value);
				obj[keys[keys.length - 1]] = (e.target.dataset.isPercent ? value / 100 : value) || 0;
				fullRender();
			});

			// Core Function Zone

			// Populates the "Base Costs & Rates" section with editable input fields.
			function populateBaseCosts() {
				baseCostsContainer.innerHTML = `
				<div>
					<h4 class="font-bold">GSR Annual Salary Scale (${currentYearKey})</h4>
					<div class="grid grid-cols-2 md:grid-cols-6 gap-2 mt-1">${Object.entries(COST_DATA.GSR_SCALE).map(([step, val]) => `<div><label class="text-xs">Point ${step}</label><input type="number" class="w-full p-1 border rounded" data-key="GSR_SCALE.${step}" value="${val}"></div>`).join('')}</div>
				</div>
				<div>
					<h4 class="font-bold">TA Annual Salary Scale (${currentYearKey}, 9-month)</h4>
					<div class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-1">${Object.entries(COST_DATA.TA_SCALE).map(([step, val]) => `<div><label class="text-xs">Point ${step}</label><input type="number" class="w-full p-1 border rounded" data-key="TA_SCALE.${step}" value="${val}"></div>`).join('')}</div>
				</div>
				<div>
					<h4 class="font-bold">AI Annual Salary Scale (${currentYearKey}, 9-month)</h4>
					<div class="grid grid-cols-2 md:grid-cols-7 gap-2 mt-1">${Object.entries(COST_DATA.AI_SCALE || {}).map(([step, val]) => `<div><label class="text-xs">Point ${step}</label><input type="number" class="w-full p-1 border rounded" data-key="AI_SCALE.${step}" value="${val}"></div>`).join('')}</div>
				</div>
				<div>
					<h4 class="font-bold">Reader & Tutor Hourly Rates</h4>
					<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-1">
						<div><label class="text-xs">Reader ($/hr)</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="READER_TUTOR_RATE" value="${COST_DATA.READER_TUTOR_RATE}"></div>
						<div><label class="text-xs">Tutor - Individual ($/hr)</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="TUTOR_INDIVIDUAL_RATE" value="${COST_DATA.TUTOR_INDIVIDUAL_RATE}"></div>
						<div><label class="text-xs">Tutor - Group ($/hr)</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="TUTOR_GROUP_RATE" value="${COST_DATA.TUTOR_GROUP_RATE}"></div>
					</div>
				</div>
				 <div>
					<h4 class="font-bold">Student Benefit Rates (%)</h4>
					<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-1">
						<div><label class="text-xs">CBR</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="BENEFIT_RATES.cbr" data-is-percent="true" value="${(COST_DATA.BENEFIT_RATES.cbr * 100).toFixed(2)}"></div>
						<div><label class="text-xs">GAEL</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="BENEFIT_RATES.gael" data-is-percent="true" value="${(COST_DATA.BENEFIT_RATES.gael * 100).toFixed(2)}"></div>
						<div><label class="text-xs">Add-On Benefit</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="BENEFIT_RATES.addOn" data-is-percent="true" value="${(COST_DATA.BENEFIT_RATES.addOn * 100).toFixed(2)}"></div>
						<div><label class="text-xs">UCRP Assessment</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="BENEFIT_RATES.ucrp" data-is-percent="true" value="${(COST_DATA.BENEFIT_RATES.ucrp * 100).toFixed(2)}"></div>
					</div>
				</div>
				<div>
					<h4 class="font-bold">Other Fees & Rates</h4>
					<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-1">
						<div><label class="text-xs">Quarterly Tuition/Fees</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="TUITION_FEES.quarterly_tuition" value="${COST_DATA.TUITION_FEES.quarterly_tuition}"></div>
						<div><label class="text-xs">Quarterly SHIP</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="TUITION_FEES.quarterly_ship" value="${COST_DATA.TUITION_FEES.quarterly_ship}"></div>
						<div><label class="text-xs">Quarterly Non-Res Fee</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="TUITION_FEES.quarterly_non_resident" value="${COST_DATA.TUITION_FEES.quarterly_non_resident}"></div>
						<div><label class="text-xs">WS Unit Salary</label><input type="number" step="0.01" class="w-full p-1 border rounded" data-key="WORK_STUDY.UNIT_SALARY_EQUIVALENT" value="${COST_DATA.WORK_STUDY.UNIT_SALARY_EQUIVALENT}"></div>
					</div>
				</div>
			`;
			}

			//Creates a new appointment object, adds it to the state, and triggers a full re-render. As is maybe obvious, for type we're looking at gsr, ta, etc.
			function addAppointment(type) {
				appointmentCounter++;
				const newAppt = {
					id: appointmentCounter,
					type: type,
					values: {
						quarter: 'Fall',
						step: '1',
						percentTime: '25',
						hours: type === 'student-assistant' ? '100' : 25 * COST_DATA.HOURS_PER_FTE_PERCENT,
						hourlyRate: (type === 'student-assistant') ? COST_DATA.READER_TUTOR_RATE : 0,
						nonResident: false,
						workStudy: false,
						workStudyUnits: 1
					},
					costs: {}
				};
				if (type === 'tutor') {
					newAppt.values.tutorType = 'Individual';
				}
				if (type !== 'gsr' && type !== 'ta' && type !== 'ai') {
					delete newAppt.values.workStudy;
					delete newAppt.values.workStudyUnits;
				}
				if (type === 'student-assistant') {
					delete newAppt.values.nonResident;
				}
				appointments.push(newAppt);
				fullRender();
			}

			// Trigger a full, destructive re-render of the appointments list when adding, deleting, or clearing appointments.
			function fullRender() {
				calculateAllCosts();
				appointmentsContainer.innerHTML = appointments.length === 0 ? '<p class="text-gray-500">No appointments added yet. Click a button above to begin.</p>' : appointments.map(appt => {
					const displayHours = (parseFloat(appt.values.percentTime) || 0) * COST_DATA.HOURS_PER_FTE_PERCENT;
					const quarterOptions = ['Fall', 'Winter', 'Spring'].map(q => `<option ${q === appt.values.quarter ? 'selected' : ''}>${q}</option>`).join('');
					const percentTimeDropdown = `<div><label class="block text-xs">% Time</label><select id="input-${appt.id}-percentTime" data-calc="percentTime" class="w-full p-1 border rounded">${Array.from({ length: 100 }, (_, i) => i + 1).map(num => `<option value="${num}" ${num == appt.values.percentTime ? 'selected' : ''}>${num}%</option>`).join('')}</select></div>`;
					let inputsHtml = '';
					switch (appt.type) {
						case 'gsr':
							inputsHtml = `<div class="grid grid-cols-2 lg:grid-cols-7 gap-4 mt-2">
								<div><label class="block text-xs">Quarter</label><select id="input-${appt.id}-quarter" data-calc="quarter" class="w-full p-1 border rounded">${quarterOptions}</select></div>
								<div><label class="block text-xs">Point</label><select id="input-${appt.id}-step" data-calc="step" class="w-full p-1 border rounded">${Object.keys(COST_DATA.GSR_SCALE).map(step => `<option value="${step}" ${step === appt.values.step ? 'selected' : ''}>${step}</option>`).join('')}</select></div>
								${percentTimeDropdown}
								<div><label class="block text-xs">Total Hours</label><input type="number" class="w-full p-1 border rounded" value="${displayHours.toFixed(0)}" readonly></div>
								<div class="text-center"><label class="block text-xs">Include NRST?</label><input type="checkbox" id="input-${appt.id}-nonResident" data-calc="nonResident" class="h-6 w-6 mt-1" ${appt.values.nonResident ? 'checked' : ''}></div>
								<div class="text-center"><label class="block text-xs">Work Study?</label><input type="checkbox" id="input-${appt.id}-workStudy" data-calc="workStudy" class="h-6 w-6 mt-1" ${appt.values.workStudy ? 'checked' : ''}></div>
								${appt.values.workStudy ? `<div><label class="block text-xs">WS Units</label><select id="input-${appt.id}-workStudyUnits" data-calc="workStudyUnits" class="w-full p-1 border rounded"><option value="1" ${appt.values.workStudyUnits == 1 ? 'selected' : ''}>1</option><option value="2" ${appt.values.workStudyUnits == 2 ? 'selected' : ''}>2</option></select></div>` : ''}
							</div>`;
							break;
						case 'ta':
							inputsHtml = `<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-2">
								<div><label class="block text-xs">Quarter</label><select id="input-${appt.id}-quarter" data-calc="quarter" class="w-full p-1 border rounded">${quarterOptions}</select></div>
								<div><label class="block text-xs">Point</label><select id="input-${appt.id}-step" data-calc="step" class="w-full p-1 border rounded">${Object.keys(COST_DATA.TA_SCALE).map(step => `<option value="${step}" ${step === appt.values.step ? 'selected' : ''}>${step}</option>`).join('')}</select></div>
								${percentTimeDropdown}
								<div><label class="block text-xs">Total Hours</label><input type="number" class="w-full p-1 border rounded" value="${displayHours.toFixed(0)}" readonly></div>
								<div class="text-center"><label class="block text-xs">Include NRST?</label><input type="checkbox" id="input-${appt.id}-nonResident" data-calc="nonResident" class="h-6 w-6 mt-1" ${appt.values.nonResident ? 'checked' : ''}></div>
							</div>`;
							break;
						case 'ai':
							inputsHtml = `<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-2">
								<div><label class="block text-xs">Quarter</label><select id="input-${appt.id}-quarter" data-calc="quarter" class="w-full p-1 border rounded">${quarterOptions}</select></div>
								<div><label class="block text-xs">Point</label><select id="input-${appt.id}-step" data-calc="step" class="w-full p-1 border rounded">${Object.keys(COST_DATA.AI_SCALE).map(step => `<option value="${step}" ${step === appt.values.step ? 'selected' : ''}>${step}</option>`).join('')}</select></div>
								${percentTimeDropdown}
								<div><label class="block text-xs">Total Hours</label><input type="number" class="w-full p-1 border rounded" value="${displayHours.toFixed(0)}" readonly></div>
								<div class="text-center"><label class="block text-xs">Include NRST?</label><input type="checkbox" id="input-${appt.id}-nonResident" data-calc="nonResident" class="h-6 w-6 mt-1" ${appt.values.nonResident ? 'checked' : ''}></div>
							</div>`;
							break;
						case 'reader':
							inputsHtml = `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-2">
								<div><label class="block text-xs">Quarter</label><select id="input-${appt.id}-quarter" data-calc="quarter" class="w-full p-1 border rounded">${quarterOptions}</select></div>
								${percentTimeDropdown}
								<div><label class="block text-xs">Total Hours</label><input type="number" class="w-full p-1 border rounded" value="${displayHours.toFixed(0)}" readonly></div>
								<div class="text-center"><label class="block text-xs">Include NRST?</label><input type="checkbox" id="input-${appt.id}-nonResident" data-calc="nonResident" class="h-6 w-6 mt-1" ${appt.values.nonResident ? 'checked' : ''}></div>
							</div>`;
							break;
						case 'tutor':
							inputsHtml = `<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-2">
								<div><label class="block text-xs">Quarter</label><select id="input-${appt.id}-quarter" data-calc="quarter" class="w-full p-1 border rounded">${quarterOptions}</select></div>
								<div>
									<label class="block text-xs">Tutor Type</label>
									<select id="input-${appt.id}-tutorType" data-calc="tutorType" class="w-full p-1 border rounded">
										<option value="Individual" ${appt.values.tutorType === 'Individual' ? 'selected' : ''}>Individual</option>
										<option value="Group" ${appt.values.tutorType === 'Group' ? 'selected' : ''}>Group</option>
									</select>
								</div>
								${percentTimeDropdown}
								<div><label class="block text-xs">Total Hours</label><input type="number" class="w-full p-1 border rounded" value="${displayHours.toFixed(0)}" readonly></div>
								<div class="text-center"><label class="block text-xs">Include NRST?</label><input type="checkbox" id="input-${appt.id}-nonResident" data-calc="nonResident" class="h-6 w-6 mt-1" ${appt.values.nonResident ? 'checked' : ''}></div>
							</div>`;
							break;
						case 'student-assistant':
							inputsHtml = `<div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-2">
								<div><label class="block text-xs">Quarter</label><select id="input-${appt.id}-quarter" data-calc="quarter" class="w-full p-1 border rounded">${quarterOptions}</select></div>
								<div><label class="block text-xs">Total Hours</label><input type="number" id="input-${appt.id}-hours" data-calc="hours" class="w-full p-1 border rounded" value="${appt.values.hours}"></div>
								<div><label class="block text-xs">Hourly Rate</label><input type="number" id="input-${appt.id}-hourlyRate" step="0.01" data-calc="hourlyRate" class="w-full p-1 border rounded" value="${appt.values.hourlyRate}"></div>
							</div>`;
							break;
					}
					const typeName = appt.type === 'student-assistant' ? 'Student Assistant' : (appt.type === 'reader' ? 'Reader' : (appt.type === 'tutor' ? `Tutor (${appt.values.tutorType || 'Individual'})` : (appt.type === 'ai' ? 'Associate Instructor' : appt.type.toUpperCase())));
					const gridColsClass = (appt.type === 'gsr' || appt.type === 'ta' || appt.type === 'ai') ? (appt.values.workStudy ? 'md:grid-cols-6' : 'md:grid-cols-5') : 'md:grid-cols-5';

					return `<div class="appointment-row" id="appointment-${appt.id}" data-id="${appt.id}" data-type="${appt.type}">
						<div class="flex justify-between items-start">
							<div><h4 class="font-bold text-lg">${typeName}</h4>${inputsHtml}</div>
							<button class="btn btn-delete mt-2 w-10 h-10 p-0 text-lg flex-shrink-0 rounded-md shadow-sm" data-id="${appt.id}">&#x2715;</button>
						</div>
						<div class="grid grid-cols-2 ${gridColsClass} gap-4 mt-4 bg-gray-50 p-2 text-center rounded">
							<div><p class="text-xs">Salary</p><p class="font-bold" data-output="salary">${formatCurrency(appt.costs.salary || 0)}</p></div>
							<div><p class="text-xs">Benefits</p><p class="font-bold" data-output="benefits">${formatCurrency(appt.costs.benefits || 0)}</p></div>
							<div><p class="text-xs">Tuition/Fees</p><p class="font-bold" data-output="tuition">${formatCurrency(appt.costs.tuition || 0)}</p></div>
							<div><p class="text-xs">Health Ins.</p><p class="font-bold" data-output="health_ins">${formatCurrency(appt.costs.health_ins || 0)}</p></div>
							<div data-output-container="workStudySavings" class="${(appt.values.workStudy) ? '' : 'hidden'}"><p class="text-xs text-green-600">WS Savings</p><p class="font-bold text-green-600" data-output="workStudySavings">${formatCurrency(appt.costs.totalWorkStudySavings || 0)}</p></div>
							<div><p class="text-xs">Total Cost</p><p class="font-bold text-lg text-[#002855]" data-output="total">${formatCurrency(appt.costs.total || 0)}</p></div>
						</div>
					</div>`;
				}).join('');
				updateSummaryTable();
				renderCalculationBreakdown();
				updateWarningVisibility();
			}

			// Performs a lightweight, non-destructive update of the DOM, updating calculated values without re-creating the input elements, preserving focus.
			function updateDOMValues() {
				appointments.forEach(appt => {
					const row = document.getElementById(`appointment-${appt.id}`);
					if (!row) return;
					if (appt.type !== 'student-assistant') {
						const hoursInput = row.querySelector('input[readonly]');
						if (hoursInput) hoursInput.value = ((parseFloat(appt.values.percentTime) || 0) * COST_DATA.HOURS_PER_FTE_PERCENT).toFixed(0);
					}
					row.querySelector('[data-output="salary"]').textContent = formatCurrency(appt.costs.salary || 0);
					row.querySelector('[data-output="benefits"]').textContent = formatCurrency(appt.costs.benefits || 0);
					row.querySelector('[data-output="tuition"]').textContent = formatCurrency(appt.costs.tuition || 0);
					row.querySelector('[data-output="health_ins"]').textContent = formatCurrency(appt.costs.health_ins || 0);
					const wsContainer = row.querySelector('[data-output-container="workStudySavings"]');
					if (wsContainer) {
						wsContainer.classList.toggle('hidden', !appt.values.workStudy);
						wsContainer.querySelector('[data-output="workStudySavings"]').textContent = formatCurrency(appt.costs.totalWorkStudySavings || 0);
					}
					row.querySelector('[data-output="total"]').textContent = formatCurrency(appt.costs.total || 0);
				});
				updateSummaryTable();
				renderCalculationBreakdown();
				updateWarningVisibility();
			}

			// Calculates initial salary and benefits for all appointments. totalBenefitRate is the combined number to which we apply the benefits.
			function calculateInitialSalaries(totalBenefitRate) {
				appointments.forEach(appt => {
					let salary = 0, salaryFormula = '';
					if (appt.type === 'gsr') {
						const annualRate = COST_DATA.GSR_SCALE[appt.values.step] || 0, percentTime = parseFloat(appt.values.percentTime) || 0;
						salary = (annualRate / 12) * 3 * (percentTime / 100);
						salaryFormula = `(${formatCurrency(annualRate)} / 12 * 3) * ${percentTime}% = ${formatCurrency(salary)}`;
					} else if (appt.type === 'ta') {
						const annualRate = COST_DATA.TA_SCALE[appt.values.step] || 0, percentTime = parseFloat(appt.values.percentTime) || 0;
						salary = (annualRate / 3) * (percentTime / 100);
						salaryFormula = `(${formatCurrency(annualRate)} / 3) * ${percentTime}% = ${formatCurrency(salary)}`;
					} else if (appt.type === 'ai') {
						const annualRate = COST_DATA.AI_SCALE[appt.values.step] || 0, percentTime = parseFloat(appt.values.percentTime) || 0;
						salary = (annualRate / 3) * (percentTime / 100);
						salaryFormula = `(${formatCurrency(annualRate)} / 3) * ${percentTime}% = ${formatCurrency(salary)}`;
					} else if (appt.type === 'reader') {
						const hours = parseFloat(appt.values.hours) || 0;
						salary = hours * COST_DATA.READER_TUTOR_RATE;
						salaryFormula = `${hours.toFixed(1)} hrs * ${formatCurrency(COST_DATA.READER_TUTOR_RATE)}/hr = ${formatCurrency(salary)}`;
					} else if (appt.type === 'tutor') {
						const hours = parseFloat(appt.values.hours) || 0;
						const rate = appt.values.tutorType === 'Group' ? COST_DATA.TUTOR_GROUP_RATE : COST_DATA.TUTOR_INDIVIDUAL_RATE;
						salary = hours * rate;
						salaryFormula = `${hours.toFixed(1)} hrs * ${formatCurrency(rate)}/hr = ${formatCurrency(salary)}`;
					} else if (appt.type === 'student-assistant') {
						const hours = parseFloat(appt.values.hours) || 0, rate = parseFloat(appt.values.hourlyRate) || 0;
						salary = hours * rate;
						salaryFormula = `${hours.toFixed(0)} hrs * ${formatCurrency(rate)}/hr = ${formatCurrency(salary)}`;
					}
					appt.costs = { salary, salaryFormula, benefits: salary * totalBenefitRate, tuition: 0, health_ins: 0, total: 0, workStudySalarySavings: 0, workStudyFeeSavings: 0, totalWorkStudySavings: 0 };
				});
			}

			// Calculates and distributes prorated fees for all appointments within a specific quarter.
			// If you're reading this you're probably smarter than me, but for me this was maddening. 
			// quarter - The quarter to calculate (e.g., 'Fall').
			// quarterAppts - An array of appointment objects for that quarter.
			function calculateProratedFees(quarter, quarterAppts) {
				calculationDetails[quarter] = { log: [`<h4 class="font-bold text-lg">${quarter} Quarter</h4>`] };
				const log = calculationDetails[quarter].log, totalBenefitRate = Object.values(COST_DATA.BENEFIT_RATES).reduce((a, b) => a + b, 0);
				log.push(`<p class="font-semibold mt-2">1. Salary & Benefits Calculation:</p>`);
				quarterAppts.forEach(appt => {
					const typeName = appt.type.toUpperCase().replace('-', ' ');
					log.push(`<p>&nbsp;&nbsp;- ${typeName} #${appt.id} Salary: ${appt.costs.salaryFormula}</p>`);
					log.push(`<p>&nbsp;&nbsp;- ${typeName} #${appt.id} Benefits: ${formatCurrency(appt.costs.salary)} * ${totalBenefitRate.toFixed(4)} = ${formatCurrency(appt.costs.benefits)}</p>`);
				});
				const titleTotals = { gsr: { percentTime: 0, salary: 0, eligible: false }, ta: { percentTime: 0, salary: 0, eligible: false }, ai: { percentTime: 0, salary: 0, eligible: false }, reader: { hours: 0, salary: 0, eligible: false }, tutor: { hours: 0, salary: 0, eligible: false } };
				let totalStudentFTE = 0;
				quarterAppts.forEach(appt => {
					if (titleTotals[appt.type]) {
						if (appt.type === 'reader' || appt.type === 'tutor') {
							titleTotals[appt.type].hours += parseFloat(appt.values.hours) || 0;
						} else if (appt.type === 'gsr' || appt.type === 'ta' || appt.type === 'ai') {
							const percent = parseFloat(appt.values.percentTime) || 0;
							titleTotals[appt.type].percentTime += percent;
							totalStudentFTE += percent;
						}
						titleTotals[appt.type].salary += appt.costs.salary;
					}
				});
				log.push(`<p class="font-semibold mt-2">2. Fee Remission Eligibility Check:</p>`);
				let eligibleTitles = [];
				const combinedHours = titleTotals.reader.hours + titleTotals.tutor.hours;
				Object.keys(titleTotals).forEach(type => {
					let isEligible = false, statusText = '';
					if (type === 'reader' || type === 'tutor') {
						isEligible = combinedHours >= 110;
						statusText = isEligible ? '<span style="color: #266040; font-weight: bold;">ELIGIBLE</span>' : '<span style="color: #c10330; font-weight: bold;">INELIGIBLE</span>';
					} else if (type === 'gsr' || type === 'ta' || type === 'ai') {
						const isConsolidatedEligible = totalStudentFTE >= 25;
						isEligible = isConsolidatedEligible;
						statusText = isEligible ? '<span style="color: #266040; font-weight: bold;">ELIGIBLE</span>' : '<span style="color: #c10330; font-weight: bold;">INELIGIBLE</span>';
					}
					if (isEligible) {
						titleTotals[type].eligible = true;
						eligibleTitles.push(type);
					}
				});
				if (titleTotals.reader.hours > 0 || titleTotals.tutor.hours > 0) {
					const statusText = combinedHours >= 110 ? '<span style="color: #266040; font-weight: bold;">ELIGIBLE</span>' : '<span style="color: #c10330; font-weight: bold;">INELIGIBLE</span>';
					log.push(`<p>&nbsp;&nbsp;- Reader/Tutor Combined: Total hours ${combinedHours.toFixed(0)} >= 110? -> ${statusText}</p>`);
				}
				if (titleTotals.gsr.percentTime > 0 || titleTotals.ta.percentTime > 0 || titleTotals.ai.percentTime > 0) {
					const statusText = totalStudentFTE >= 25 ? '<span style="color: #266040; font-weight: bold;">ELIGIBLE</span>' : '<span style="color: #c10330; font-weight: bold;">INELIGIBLE</span>';
					log.push(`<p>&nbsp;&nbsp;- GSR/TA/AI Group: Total Quarter Effort ${totalStudentFTE}% >= 25%? -> ${statusText}</p>`);
				}
				if (eligibleTitles.length === 0) {
					log.push(`<p class="font-semibold mt-2">Result: No appointments eligible for fee remission.</p>`);
					quarterAppts.forEach(appt => appt.costs.total = appt.costs.salary + appt.costs.benefits);
					return;
				}
				const { quarterly_tuition: totalTuition, quarterly_ship: totalShip, quarterly_non_resident: nonResFee } = COST_DATA.TUITION_FEES;
				const isNonResidentQuarter = quarterAppts.some(a => a.values.nonResident && titleTotals[a.type]?.eligible);
				const totalNonRes = isNonResidentQuarter ? nonResFee : 0;
				log.push(`<p class="font-semibold mt-2">3. Total Fees for Quarter:</p>`);
				log.push(`<p>&nbsp;&nbsp;- Tuition/Fees: ${formatCurrency(totalTuition)}</p>`);
				log.push(`<p>&nbsp;&nbsp;- Health Insurance (SHIP): ${formatCurrency(totalShip)}</p>`);
				log.push(`<p>&nbsp;&nbsp;- Non-Resident Fee: ${formatCurrency(totalNonRes)}</p>`);
				let totalEligibleSalary = quarterAppts.reduce((sum, appt) => titleTotals[appt.type]?.eligible ? sum + appt.costs.salary : sum, 0);
				log.push(`<p class="font-semibold mt-2">4. Proration Calculation (based on total eligible salary of ${formatCurrency(totalEligibleSalary)}):</p>`);
				const hasEligibleGSR = quarterAppts.some(a => a.type === 'gsr' && titleTotals.gsr.eligible);
				quarterAppts.forEach(appt => {
					if (titleTotals[appt.type]?.eligible) {
						const prorationFactor = totalEligibleSalary > 0 ? (appt.costs.salary / totalEligibleSalary) : 0;
						log.push(`<p>&nbsp;&nbsp;- ${appt.type.toUpperCase().replace('-', ' ')} #${appt.id} Proration: ${formatCurrency(appt.costs.salary)} / ${formatCurrency(totalEligibleSalary)} = ${(prorationFactor * 100).toFixed(2)}%</p>`);
						appt.costs.tuition = totalTuition * prorationFactor;
						appt.costs.health_ins = totalShip * prorationFactor;

						const standardFeesForAppt = appt.costs.tuition + appt.costs.health_ins;

						if (totalNonRes > 0) {
							if (hasEligibleGSR) {
								if (appt.type === 'gsr') {
									const gsrSalaryTotal = titleTotals.gsr.salary;
									const gsrProrationFactor = gsrSalaryTotal > 0 ? (appt.costs.salary / gsrSalaryTotal) : 0;
									appt.costs.tuition += totalNonRes * gsrProrationFactor;
									log.push(`<p>&nbsp;&nbsp;&nbsp;&nbsp;...GSR bears NRST. Share: ${(gsrProrationFactor * 100).toFixed(2)}% of ${formatCurrency(totalNonRes)} = ${formatCurrency(totalNonRes * gsrProrationFactor)}</p>`);
								} else {
									log.push(`<p>&nbsp;&nbsp;&nbsp;&nbsp;...NRST covered by GSR. This appointment pays $0.</p>`);
								}
							} else {
								appt.costs.tuition += totalNonRes * prorationFactor;
								log.push(`<p>&nbsp;&nbsp;&nbsp;&nbsp;...No GSR. Prorated NRST: ${(prorationFactor * 100).toFixed(2)}% of ${formatCurrency(totalNonRes)} = ${formatCurrency(totalNonRes * prorationFactor)}</p>`);
							}
						}

						// work-study is infuriating.
						if (appt.values.workStudy) {
							const salaryCap = COST_DATA.WORK_STUDY.UNIT_SALARY_EQUIVALENT * appt.values.workStudyUnits;
							const salarySavings = Math.min(appt.costs.salary, salaryCap) * COST_DATA.WORK_STUDY.SAVINGS_RATE;

							appt.costs.workStudySalarySavings = salarySavings;

							const salaryCoveragePercentage = appt.costs.salary > 0 ? appt.costs.workStudySalarySavings / appt.costs.salary : 0;
							appt.costs.workStudyFeeSavings = standardFeesForAppt * salaryCoveragePercentage;
							appt.costs.totalWorkStudySavings = appt.costs.workStudySalarySavings + appt.costs.workStudyFeeSavings;

							log.push(`<p class="font-semibold mt-2">5. Work Study Savings for GSR #${appt.id}:</p>`);
							log.push(`<p>&nbsp;&nbsp;- Applied Salary Savings: ${formatCurrency(appt.costs.workStudySalarySavings)}</p>`);
							log.push(`<p>&nbsp;&nbsp;- Applied Fee Savings: ${formatCurrency(appt.costs.workStudyFeeSavings)}</p>`);
							log.push(`<p>&nbsp;&nbsp;- Total WS Savings for this appointment: ${formatCurrency(appt.costs.totalWorkStudySavings)}</p>`);
						}
					}
					appt.costs.total = appt.costs.salary + appt.costs.benefits + appt.costs.tuition + appt.costs.health_ins - appt.costs.totalWorkStudySavings;
				});
			}

			// Main calculationizer. Real word, look it up. Resets costs, then calculates salaries, then prorates fees.
			function calculateAllCosts() {
				calculationDetails = {};
				const totalBenefitRate = Object.values(COST_DATA.BENEFIT_RATES).reduce((a, b) => a + b, 0);
				appointments.forEach(appt => appt.costs = { salary: 0, benefits: 0, tuition: 0, health_ins: 0, total: 0, workStudySalarySavings: 0, workStudyFeeSavings: 0, totalWorkStudySavings: 0 });
				calculateInitialSalaries(totalBenefitRate);
				['Fall', 'Winter', 'Spring'].forEach(quarter => {
					const quarterAppts = appointments.filter(a => a.values.quarter === quarter);
					if (quarterAppts.length > 0) calculateProratedFees(quarter, quarterAppts);
				});
			}

			// Renders the "Show Your Work" section based on the calculationDetails object.
			function renderCalculationBreakdown() {
				showWorkContainer.innerHTML = '';
				const quarters = ['Fall', 'Winter', 'Spring'];
				let hasCalculations = false;
				quarters.forEach(quarter => {
					if (calculationDetails[quarter]) {
						hasCalculations = true;
						const quarterDiv = document.createElement('div');
						quarterDiv.innerHTML = calculationDetails[quarter].log.join('');
						showWorkContainer.appendChild(quarterDiv);
					}
				});
				if (!hasCalculations) showWorkContainer.innerHTML = '<p>Add an appointment to see calculation details.</p>';
			}

			// Shows or hides the warning cards based on current selections.
			// Basically this calculator could be used by a couple of different populations, some of whom could be sailed into the rocks by NRST being included for ASEs at all and the FTE stuff. So, we warn.
			function updateWarningVisibility() {
				const isAnyNonResident = appointments.some(appt => appt.values.nonResident);
				if (isAnyNonResident) {
					nrstWarningCard.innerHTML = `<p class="font-bold">Caution!</p><p>Non-Residential Supplementary Tuition administration can be complex and case-dependent. Before including NRST remission in any cost forecasting, please review the latest guidelines on the applicability of doing so to the appointment type you have selected.</p>`;
					nrstWarningCard.classList.remove('hidden');
				} else {
					nrstWarningCard.classList.add('hidden');
				}

				let fteWarning = '';
				['Fall', 'Winter', 'Spring'].forEach(quarter => {
					const totalFTE = appointments.reduce((sum, appt) => {
						return (appt.values.quarter === quarter && appt.type !== 'student-assistant') ? sum + (parseFloat(appt.values.percentTime) || 0) : sum;
					}, 0);

					if (totalFTE > 75) {
						fteWarning = `<p class="font-bold text-red-700">Warning!</p><p>Total student employment may not exceed 75% during an academic quarter. This includes all ASE/GSR appointments across all departments.</p>`;
					} else if (totalFTE > 50 && !fteWarning) {
						fteWarning = `<p class="font-bold text-yellow-800">Caution!</p><p>Employment is typically limited to 50% during an academic quarter. For more information, please see <a href="https://grad.ucdavis.edu/student-employment" target="_blank" class="underline">this page</a>.</p>`;
					}
				});

				if (fteWarning) {
					fteWarningCard.innerHTML = fteWarning;
					fteWarningCard.classList.remove('hidden');
					if (fteWarning.includes("Warning!")) {
						fteWarningCard.classList.remove('bg-yellow-100', 'border-yellow-400', 'text-yellow-800');
						fteWarningCard.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
					} else {
						fteWarningCard.classList.remove('bg-red-100', 'border-red-400', 'text-red-700');
						fteWarningCard.classList.add('bg-yellow-100', 'border-yellow-400', 'text-yellow-800');
					}
				} else {
					fteWarningCard.classList.add('hidden');
				}
			}

			// Updates the main "Cost Summary by Quarter" table at the bottom of the page.
			function updateSummaryTable() {
				const summary = { Fall: { salary: 0, benefitsAndFees: 0, total: 0, workStudySavings: 0 }, Winter: { salary: 0, benefitsAndFees: 0, total: 0, workStudySavings: 0 }, Spring: { salary: 0, benefitsAndFees: 0, total: 0, workStudySavings: 0 } };
				let hasWorkStudy = false;
				appointments.forEach(appt => {
					const quarter = appt.values.quarter;
					if (summary[quarter]) {
						summary[quarter].salary += appt.costs.salary;
						summary[quarter].benefitsAndFees += (appt.costs.benefits + appt.costs.tuition + appt.costs.health_ins);
						summary[quarter].total += appt.costs.total;
						summary[quarter].workStudySavings += appt.costs.totalWorkStudySavings;
						if (appt.values.workStudy) hasWorkStudy = true;
					}
				});

				summaryTable.classList.toggle('ws-hidden', !hasWorkStudy);

				const tableBody = document.getElementById('summary-table-body');
				tableBody.innerHTML = '';
				let grandTotal = { salary: 0, benefitsAndFees: 0, total: 0, workStudySavings: 0 };
				['Fall', 'Winter', 'Spring'].forEach(q => {
					const quarterData = summary[q];
					grandTotal.salary += quarterData.salary;
					grandTotal.benefitsAndFees += quarterData.benefitsAndFees;
					grandTotal.total += quarterData.total;
					grandTotal.workStudySavings += quarterData.workStudySavings;
					tableBody.innerHTML += `<tr><td class="p-2">${q}</td><td class="p-2 text-right">${formatCurrency(quarterData.salary)}</td><td class="p-2 text-right">${formatCurrency(quarterData.benefitsAndFees)}</td><td class="p-2 text-right text-green-600 ws-savings-col">${formatCurrency(quarterData.workStudySavings)}</td><td class="p-2 text-right">${formatCurrency(quarterData.total)}</td></tr>`;
				});
				document.getElementById('summary-total-salary').textContent = formatCurrency(grandTotal.salary);
				document.getElementById('summary-total-benefits-fees').textContent = formatCurrency(grandTotal.benefitsAndFees);
				document.getElementById('summary-total-savings').textContent = formatCurrency(grandTotal.workStudySavings);
				document.getElementById('summary-grand-total').textContent = formatCurrency(grandTotal.total);

				if (grandTotal.workStudySavings > 0) {
					workStudySummaryCard.innerHTML = `<p class="font-bold">Work Study Savings:</p>
					<div class="grid grid-cols-4 text-center">
						<p>Fall: ${formatCurrency(summary.Fall.workStudySavings)}</p>
						<p>Winter: ${formatCurrency(summary.Winter.workStudySavings)}</p>
						<p>Spring: ${formatCurrency(summary.Spring.workStudySavings)}</p>
						<p class="font-bold">Total: ${formatCurrency(grandTotal.workStudySavings)}</p>
					</div>`;
					workStudySummaryCard.classList.remove('hidden');
				} else {
					workStudySummaryCard.classList.add('hidden');
				}
			}

			// Helper function to format a number as US currency and return the formatted currency string.
			// value - The number to format.
			function formatCurrency(value) {
				return (value || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
			}

			// Initial Load is handled inside initialize()
		});
	</script>
</body>

</html>
