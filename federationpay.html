<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Federation Salary Calculator (Beta)</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="shared-tools.css">
    <script src="header.js" defer></script>
	<style>
		.toggle-btn svg { transition: transform 0.3s ease-in-out; }
		.toggle-btn.is-open svg { transform: rotate(90deg); }
		input[readonly] { background-color: #f0f0f0; cursor: not-allowed; }
		table { width: 100%; border-collapse: collapse; }
		th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
		th { background-color: #f8fafc; font-weight: 600; }
		.summary-table tfoot tr:first-child td { border-top: 2px solid var(--ucd-blue); font-weight: bold; }
	</style>
</head>
<body class="bg-[#f8fafc] flex flex-col min-h-screen">
    <div id="header-placeholder"></div>

	<main class="w-full max-w-5xl mx-auto p-4 md:p-8">
		<div class="space-y-6">
			<div class="text-center">
				<h1 class="text-4xl font-bold text-gray-800">Federation Salary Calculator (Beta)</h1>
				<p class="text-lg text-gray-600 mt-1">For Academic Federation Personnel</p>
			</div>

			<section class="card">
				<h2 class="text-xl font-bold text-gray-800 mb-4">1. Appointment Information</h2>
				<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
					<div>
						<label class="block text-sm font-medium text-gray-700">Appointment Title</label>
						<select id="fedTitle" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                            <option value="">-- Select Title --</option>
						</select>
					</div>
					<div id="variantControls" class="hidden">
                        <div class="grid grid-cols-2 gap-4">
                            <div id="exemptContainer" class="hidden">
                                <label class="block text-sm font-medium text-gray-700">Exemption Status</label>
                                <select id="fedExempt" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></select>
                            </div>
                            <div id="repContainer" class="hidden">
                                <label class="block text-sm font-medium text-gray-700">Representation</label>
                                <select id="fedRep" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></select>
                            </div>
                        </div>
                        <div class="mt-2 text-sm text-blue-600">
                            <a id="salaryLink" href="#" target="_blank" class="hover:underline">View Salary Scale PDF</a>
                        </div>
					</div>
				</div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rank (Optional)</label>
                        <select id="fedRank" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                            <option value="Assistant">Assistant</option>
                            <option value="Associate">Associate</option>
                            <option value="Full">Full</option>
                            <option value="None">N/A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Step (Optional)</label>
                        <input type="number" id="fedStep" value="1" min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                </div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
					<div>
						<label for="annualSalary" class="block text-sm font-medium text-gray-700">Annual Salary (100% FTE)</label>
						<div class="relative mt-1">
							<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
								<span class="text-gray-500 sm:text-sm">$</span>
							</div>
							<input type="number" id="annualSalary" class="block w-full rounded-md border-gray-300 pl-7">
						</div>
					</div>
					<div>
						<label for="benefitRate" class="block text-sm font-medium text-gray-700 text-right">Benefit Rate</label>
						<div class="relative mt-1">
							<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
								<span class="text-gray-500 sm:text-sm">%</span>
							</div>
							<input type="text" id="benefitRate" value="40.4" class="block w-full rounded-md border-gray-300 text-right pr-8">
						</div>
					</div>
				</div>
			</section>

			<section class="card">
				<div class="flex justify-between items-center mb-4">
					<h2 class="text-xl font-bold text-gray-800">2. Workload / Appointment Duration</h2>
					<button id="addDutyBtn" class="btn text-sm">Add Period/Duty</button>
				</div>
				<div class="overflow-x-auto">
					<table class="min-w-full">
						<thead id="workload-thead">
                            <!-- Populated dynamically based on AY/FY -->
						</thead>
						<tbody id="workload-container">
						</tbody>
					</table>
					<p id="no-duties-msg" class="text-center text-gray-500 py-4">No appointments added yet.</p>
				</div>
			</section>

			<div id="warnings-card" class="card hidden"></div>

			<section class="card bg-gray-50">
				<div class="flex justify-between items-center mb-4">
					<h2 class="text-xl font-bold text-gray-800">3. Summary</h2>
					<button id="saveCsvBtn" class="btn text-sm">Save to CSV</button>
				</div>
				<div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center mb-6">
					<div id="summary-metric-1-container">
						<p class="text-sm text-gray-600" id="summary-metric-1-label">Total IWC</p>
						<p class="text-2xl font-bold text-[#002855]" id="summary-metric-1-val">0.00</p>
					</div>
					<div>
						<p class="text-sm text-gray-600">Annualized FTE</p>
						<p class="text-2xl font-bold text-[#002855]" id="summary-fte-val">0.00%</p>
					</div>
					<div>
						<p class="text-sm text-gray-600">Total Pay</p>
						<p class="text-2xl font-bold text-gray-800" id="summary-pay-val">$0.00</p>
					</div>
					<div>
						<p class="text-sm text-gray-600">Total Cost</p>
						<p class="text-2xl font-bold text-green-700" id="summary-cost-val">$0.00</p>
					</div>
				</div>
				<div class="overflow-x-auto">
					<table class="min-w-full text-sm summary-table">
						<thead id="summary-thead">
						</thead>
						<tbody id="summary-table-body">
						</tbody>
						<tfoot id="summary-tfoot">
						</tfoot>
					</table>
				</div>
			</section>
		</div>
	</main>

		document.addEventListener('DOMContentLoaded', () => {
			let duties = [];
			let dutyCounter = 0;
            let currentApptType = 'Fiscal'; // Academic or Fiscal

			const fedTitle = document.getElementById('fedTitle');
            const variantControls = document.getElementById('variantControls');
            const exemptContainer = document.getElementById('exemptContainer');
            const fedExempt = document.getElementById('fedExempt');
            const repContainer = document.getElementById('repContainer');
            const fedRep = document.getElementById('fedRep');
            const salaryLink = document.getElementById('salaryLink');
            
			const annualSalaryInput = document.getElementById('annualSalary');
			const benefitRateInput = document.getElementById('benefitRate');
			const addDutyBtn = document.getElementById('addDutyBtn');
			const workloadContainer = document.getElementById('workload-container');
			const workloadThead = document.getElementById('workload-thead');
			const noDutiesMsg = document.getElementById('no-duties-msg');
			const warningsCard = document.getElementById('warnings-card');
			const saveCsvBtn = document.getElementById('saveCsvBtn');

			const formatCurrency = (value) => (value || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
			const getCleanNumber = (value) => parseFloat(String(value).replace(/[^0-9.]/g, '')) || 0;

            // Initialize Title Dropdown
            Object.keys(FEDERATION_DATA).sort().forEach(title => {
                fedTitle.appendChild(new Option(title, title));
            });

            function handleTitleChange() {
                const titleKey = fedTitle.value;
                if (!titleKey) {
                    variantControls.classList.add('hidden');
                    return;
                }
                
                const data = FEDERATION_DATA[titleKey];
                currentApptType = data.type; // Academic or Fiscal
                
                // Process variants
                const variants = data.variants;
                const exempts = [...new Set(variants.map(v => v.exempt))].filter(e => e !== 'Unknown');
                const reps = [...new Set(variants.map(v => v.represented))].filter(r => r !== 'Unknown');

                variantControls.classList.remove('hidden');

                if (exempts.length > 0) {
                    exemptContainer.classList.remove('hidden');
                    fedExempt.innerHTML = '';
                    exempts.forEach(e => fedExempt.appendChild(new Option(e, e)));
                } else {
                    exemptContainer.classList.add('hidden');
                    fedExempt.innerHTML = '<option value="Unknown">Unknown</option>';
                }

                if (reps.length > 0) {
                    repContainer.classList.remove('hidden');
                    fedRep.innerHTML = '';
                    reps.forEach(r => fedRep.appendChild(new Option(r, r)));
                } else {
                    repContainer.classList.add('hidden');
                    fedRep.innerHTML = '<option value="Unknown">Unknown</option>';
                }

                updateLink();
                renderTableHeaders();
                renderDuties(); // Redraw inputs to match AY/FY
                runAllCalculations();
            }

            function updateLink() {
                const titleKey = fedTitle.value;
                if (!titleKey) return;
                const data = FEDERATION_DATA[titleKey];
                const eVal = fedExempt.value;
                const rVal = fedRep.value;
                
                let found = data.variants.find(v => (v.exempt === eVal || eVal === 'Unknown' || v.exempt === 'Unknown') && 
                                                    (v.represented === rVal || rVal === 'Unknown' || v.represented === 'Unknown'));
                if (found && found.link && found.link.startsWith('http')) {
                    salaryLink.href = found.link;
                    salaryLink.textContent = "View Salary Scale PDF";
                    salaryLink.style.display = 'inline';
                } else {
                    salaryLink.style.display = 'none';
                }
            }

            function renderTableHeaders() {
                if (currentApptType === 'Academic') {
                    workloadThead.innerHTML = `<tr>
                        <th>Quarter</th>
                        <th>Description</th>
                        <th class="w-1/4">IWC</th>
                        <th class="w-16"></th>
                    </tr>`;
                    document.getElementById('summary-thead').innerHTML = `<tr>
                        <th>Quarter</th>
                        <th class="text-right">IWC</th>
                        <th class="text-right">Quarter FTE</th>
                        <th class="text-right">Salary</th>
                        <th class="text-right">Benefits</th>
                        <th class="text-right">Total Cost</th>
                    </tr>`;
                    document.getElementById('summary-metric-1-label').textContent = 'Total IWC';
                } else {
                    workloadThead.innerHTML = `<tr>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Description</th>
                        <th class="w-1/4">% FTE</th>
                        <th class="w-16"></th>
                    </tr>`;
                    document.getElementById('summary-thead').innerHTML = `<tr>
                        <th>Period</th>
                        <th class="text-right">Months</th>
                        <th class="text-right">FTE</th>
                        <th class="text-right">Salary</th>
                        <th class="text-right">Benefits</th>
                        <th class="text-right">Total Cost</th>
                    </tr>`;
                    document.getElementById('summary-metric-1-label').textContent = 'Total Months';
                }
            }

			function renderDuties() {
				workloadContainer.innerHTML = '';
				noDutiesMsg.style.display = duties.length === 0 ? 'block' : 'none';
				duties.forEach(duty => {
					const row = document.createElement('tr');
					row.dataset.id = duty.id;
                    
                    if (currentApptType === 'Academic') {
                        row.innerHTML = `
                        <td>
                            <select data-field="quarter" class="w-full rounded-md border-gray-300 shadow-sm">
                                <option value="Fall" ${duty.quarter === 'Fall' ? 'selected' : ''}>Fall</option>
                                <option value="Winter" ${duty.quarter === 'Winter' ? 'selected' : ''}>Winter</option>
                                <option value="Spring" ${duty.quarter === 'Spring' ? 'selected' : ''}>Spring</option>
                            </select>
                        </td>
                        <td><input type="text" data-field="description" value="${duty.description}" class="w-full rounded-md border-gray-300 shadow-sm"></td>
                        <td><input type="number" step="0.1" data-field="iwc" value="${duty.iwc}" class="w-full rounded-md border-gray-300 shadow-sm"></td>
                        <td><button class="btn btn-delete w-full text-lg p-0 h-10" data-action="delete">&#x2715;</button></td>
                        `;
                    } else {
                        row.innerHTML = `
                        <td><input type="date" data-field="startDate" value="${duty.startDate}" class="w-full rounded-md border-gray-300 shadow-sm"></td>
                        <td><input type="date" data-field="endDate" value="${duty.endDate}" class="w-full rounded-md border-gray-300 shadow-sm"></td>
                        <td><input type="text" data-field="description" value="${duty.description}" class="w-full rounded-md border-gray-300 shadow-sm"></td>
                        <td>
                            <div class="relative">
                                <input type="number" step="1" data-field="percentFte" value="${duty.percentFte}" class="w-full rounded-md border-gray-300 shadow-sm pr-8">
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3"><span class="text-gray-500 sm:text-sm">%</span></div>
                            </div>
                        </td>
                        <td><button class="btn btn-delete w-full text-lg p-0 h-10" data-action="delete">&#x2715;</button></td>
                        `;
                    }
					workloadContainer.appendChild(row);
				});
			}

			function runAllCalculations() {
				const annualSalary = getCleanNumber(annualSalaryInput.value);
				const benefitRate = getCleanNumber(benefitRateInput.value) / 100;
				const summaryTableBody = document.getElementById('summary-table-body');
				summaryTableBody.innerHTML = '';

				let totalMetric1 = 0; // IWC or Months
                let totalFteSum = 0; // for weighted average annual FTE
				let totalPay = 0, totalBenefits = 0;
                let messages = [];

                if (currentApptType === 'Academic') {
                    const quarterlyData = { Fall: { iwc: 0 }, Winter: { iwc: 0 }, Spring: { iwc: 0 } };
                    duties.forEach(duty => { quarterlyData[duty.quarter].iwc += parseFloat(duty.iwc) || 0; });

                    Object.keys(quarterlyData).forEach(quarter => {
                        const data = quarterlyData[quarter];
                        if (data.iwc === 0) return;
                        
                        data.fte = data.iwc / 3.0; // 3.0 IWC is a 100% quarter.
                        data.pay = annualSalary * (data.iwc / 9.0); // 9.0 IWC is a 100% year.
                        data.benefits = data.pay * benefitRate;
                        data.totalCost = data.pay + data.benefits;
                        
                        totalMetric1 += data.iwc;
                        totalPay += data.pay;
                        totalBenefits += data.benefits;

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${quarter}</td>
                            <td class="text-right">${data.iwc.toFixed(2)}</td>
                            <td class="text-right">${(data.fte * 100).toFixed(2)}%</td>
                            <td class="text-right">${formatCurrency(data.pay)}</td>
                            <td class="text-right">${formatCurrency(data.benefits)}</td>
                            <td class="text-right">${formatCurrency(data.totalCost)}</td>
                        `;
                        summaryTableBody.appendChild(row);

                        if (data.fte > 1) messages.push(`<p><strong>Caution:</strong> ${quarter} FTE exceeds 100%.</p>`);
                    });

                    totalFteSum = totalMetric1 / 9.0;
                    if (totalMetric1 > 9) messages.push(`<p><strong>Error:</strong> Total IWC exceeds 9.0 (100% annual).</p>`);

                } else {
                    // Fiscal Year (Date based)
                    duties.forEach(duty => {
                        if (!duty.startDate || !duty.endDate) return;
                        const start = new Date(duty.startDate);
                        const end = new Date(duty.endDate);
                        if (isNaN(start) || isNaN(end) || end < start) return;
                        
                        // Calculate months (approximate by days / 30.44 for simplicity in beta, or just precise month diff)
                        const diffTime = Math.abs(end - start);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // inclusive
                        const months = diffDays / 30.4167; // average days in a month
                        
                        const fte = (parseFloat(duty.percentFte) || 0) / 100;
                        const pay = annualSalary * (months / 12) * fte;
                        const benefits = pay * benefitRate;
                        const totalCost = pay + benefits;

                        totalMetric1 += months;
                        totalFteSum += (months / 12) * fte; // weighted contribution to annual FTE
                        totalPay += pay;
                        totalBenefits += benefits;

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${duty.startDate} to ${duty.endDate}</td>
                            <td class="text-right">${months.toFixed(2)}</td>
                            <td class="text-right">${(fte * 100).toFixed(2)}%</td>
                            <td class="text-right">${formatCurrency(pay)}</td>
                            <td class="text-right">${formatCurrency(benefits)}</td>
                            <td class="text-right">${formatCurrency(totalCost)}</td>
                        `;
                        summaryTableBody.appendChild(row);
                    });
                    
                    if (totalMetric1 > 12) messages.push(`<p><strong>Caution:</strong> Total duration exceeds 12 months.</p>`);
                }

				const totalCost = totalPay + totalBenefits;

				document.getElementById('summary-metric-1-val').textContent = totalMetric1.toFixed(2);
				document.getElementById('summary-fte-val').textContent = `${(totalFteSum * 100).toFixed(2)}%`;
				document.getElementById('summary-pay-val').textContent = formatCurrency(totalPay);
				document.getElementById('summary-cost-val').textContent = formatCurrency(totalCost);

                document.getElementById('summary-tfoot').innerHTML = `
                    <tr>
                        <td><strong>Total</strong></td>
                        <td class="text-right"><strong>${totalMetric1.toFixed(2)}</strong></td>
                        <td class="text-right"></td>
                        <td class="text-right"><strong>${formatCurrency(totalPay)}</strong></td>
                        <td class="text-right"><strong>${formatCurrency(totalBenefits)}</strong></td>
                        <td class="text-right"><strong>${formatCurrency(totalCost)}</strong></td>
                    </tr>
                `;

				if (messages.length > 0) {
					warningsCard.innerHTML = messages.join('');
					warningsCard.classList.remove('hidden');
					warningsCard.className = 'card bg-yellow-100 border-yellow-400 text-yellow-800';
				} else {
					warningsCard.classList.add('hidden');
				}
			}

			// Event listeners
            fedTitle.addEventListener('change', handleTitleChange);
            fedExempt.addEventListener('change', () => { updateLink(); runAllCalculations(); });
            fedRep.addEventListener('change', () => { updateLink(); runAllCalculations(); });

			annualSalaryInput.addEventListener('input', runAllCalculations);
			benefitRateInput.addEventListener('input', runAllCalculations);
            
			addDutyBtn.addEventListener('click', () => {
                if (currentApptType === 'Academic') {
				    duties.push({ id: ++dutyCounter, quarter: 'Fall', description: 'New Course', iwc: 1.5 });
                } else {
                    duties.push({ id: ++dutyCounter, startDate: '', endDate: '', description: 'New Appt', percentFte: 100 });
                }
				renderDuties();
				runAllCalculations();
			});

			workloadContainer.addEventListener('input', (e) => {
                const target = e.target;
                const row = target.closest('tr');
                if (!row) return;
                const duty = duties.find(d => d.id === parseInt(row.dataset.id, 10));
                if (duty) {
                    duty[target.dataset.field] = target.value;
                    runAllCalculations(); 
                }
            });
			
            workloadContainer.addEventListener('click', (e) => {
				if (e.target.dataset.action === 'delete') {
					const row = e.target.closest('tr');
					duties = duties.filter(d => d.id !== parseInt(row.dataset.id, 10));
					renderDuties();
					runAllCalculations();
				}
			});

            handleTitleChange(); // Init
		});
	</script>
</body>
</html>
